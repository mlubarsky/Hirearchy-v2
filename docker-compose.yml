services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./api/.env
    # All data lives in MongoDB Atlas — MONGO_URI comes from api/.env.

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./web/.env
    depends_on:
      - api
